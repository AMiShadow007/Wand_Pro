name: Build and Release WandEnhancer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build executable
        shell: cmd
        run: |
          echo Building WandEnhancer...
          call build.cmd
          if errorlevel 1 exit /b 1

      - name: Find executable
        shell: powershell
        run: |
          Write-Host "Searching for WandEnhancer.exe..."

          $exe = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "WandEnhancer.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Host ""
            Write-Host "ERROR: WandEnhancer.exe was not found."
            Write-Host ""
            Write-Host "Files produced by the build:"
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File |
              Select-Object -ExpandProperty FullName
            exit 1
          }

          Write-Host ""
          Write-Host "Found executable:"
          Write-Host $exe.FullName
          Write-Host ""

          "EXE_PATH=$($exe.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "$env:EXE_PATH#WandEnhancer.exe" `
            --title "WandEnhancer ${{ github.ref_name }}" `
            --generate-notes
