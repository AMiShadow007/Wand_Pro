name: Build and Release Wand Pro

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install dependencies
        shell: powershell
        run: |
          pnpm install --frozen-lockfile

      - name: Build Wand Pro
        shell: cmd
        run: |
          call build.cmd
          if errorlevel 1 exit /b 1

      - name: Locate executable
        shell: powershell
        run: |
          $exe = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "WandEnhancer.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "WandEnhancer.exe was not produced by the build."
            exit 1
          }

          Write-Host "Executable found:"
          Write-Host $exe.FullName

          "EXE_PATH=$($exe.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "$EXE_PATH#WandEnhancer.exe" \
            --repo "${{ github.repository }}" \
            --title "Wand Pro ${GITHUB_REF_NAME}" \
            --generate-notes
